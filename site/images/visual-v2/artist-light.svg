<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="600" viewBox="0 0 900 600" fill="none">
  <title>Custom artwork, configuration, order and fulfilment</title>
  <desc>Four connected floating interface modules follow a sculptural object from a creator's gallery through customization, order confirmation and delivery.</desc>
  <defs>
    <filter id="card-shadow" x="-30%" y="-25%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="15" stdDeviation="17" flood-color="#243c65" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#243c65" flood-opacity="0.05"/>
    </filter>
    <filter id="object-shadow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <linearGradient id="vase-front" x1="34" y1="37" x2="98" y2="161" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4388f4"/><stop offset="1" stop-color="#0052d9"/>
    </linearGradient>
    <linearGradient id="vase-side" x1="114" y1="44" x2="82" y2="155" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2477e9"/><stop offset="1" stop-color="#0039a6"/>
    </linearGradient>
    <linearGradient id="vase-top" x1="44" y1="23" x2="110" y2="43" gradientUnits="userSpaceOnUse">
      <stop stop-color="#95baff"/><stop offset="1" stop-color="#4388f4"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0.45" cy="0.47" r="0.59">
      <stop stop-color="#0052d9" stop-opacity="0.045"/><stop offset="1" stop-color="#f3f3f3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dot-grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#d9e2f1"/>
    </pattern>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="m1 1 2 2-2 2" stroke="#0052d9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="vase">
      <ellipse cx="80" cy="167" rx="49" ry="7" fill="#243c65" opacity="0.12" filter="url(#object-shadow)"/>
      <path d="m47 30-11 27-6 71 19 30h31V80L47 30Z" fill="url(#vase-front)"/>
      <path d="m113 30 11 27 6 71-19 30H80V80l33-50Z" fill="url(#vase-side)"/>
      <path d="m47 30 33 50 33-50H47Z" fill="#4388f4"/>
      <path d="m36 57 44 23 44-23M80 80v78" stroke="#95baff" stroke-opacity="0.35"/>
      <path d="m36 57-6 71 19 30" stroke="#95baff" stroke-opacity="0.45"/>
      <ellipse cx="80" cy="30" rx="33" ry="11" fill="url(#vase-top)"/>
      <ellipse cx="80" cy="29" rx="25" ry="6.4" fill="#123d85"/>
      <path d="M55 30c10-5 40-5 50 0" stroke="#70a9ff" stroke-opacity="0.6"/>
      <path d="m47 39-7 18-3 41" stroke="#ffffff" stroke-width="2" stroke-opacity="0.28" stroke-linecap="round"/>
    </g>
    <g id="check" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="m-4 0 2.5 2.5L4-3"/>
    </g>
  </defs>

  <path fill="#f3f3f3" d="M0 0h900v600H0z"/>
  <path fill="url(#ambient)" d="M0 0h900v600H0z"/>

  <!-- A restrained shared coordinate field, with no enclosing frame. -->
  <g stroke="#d9e2f1" stroke-width="1" opacity="0.55">
    <path d="M52 92h19m-9-9v19M824 116h19m-9-9v19M805 498h19m-9-9v19M244 523h19m-9-9v19"/>
    <path d="M303 83h29M610 508h28" stroke-dasharray="2 6"/>
  </g>
  <g fill="#0052d9" opacity="0.3">
    <circle cx="325" cy="499" r="2"/><circle cx="608" cy="135" r="2"/><circle cx="752" cy="102" r="2"/>
  </g>

  <!-- The only connecting path is the actual four-step business sequence. -->
  <g stroke="#bdcce7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M306 220h11c12 0 17-5 17-17v-17c0-12 5-17 17-17h5" marker-end="url(#arrow)"/>
    <path d="M466 284v36" marker-end="url(#arrow)"/>
    <path d="M576 422h12c13 0 18-5 18-18v-75c0-13 5-18 18-18h2" marker-end="url(#arrow)"/>
  </g>
  <g fill="#0052d9" stroke="#f3f3f3" stroke-width="3">
    <circle cx="334" cy="199" r="4"/><circle cx="466" cy="302" r="4"/><circle cx="606" cy="367" r="4"/>
  </g>

  <!-- Creator gallery: an original faceted vessel, selection bounds and variants. -->
  <g transform="translate(56 114)">
    <rect width="250" height="362" rx="17" fill="#ffffff" stroke="#dedfe3" filter="url(#card-shadow)"/>
    <g transform="translate(21 22)" stroke="#484f5c" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
      <path d="m0 10 5-9 10 4-5 9L0 10Z"/><path d="m5 1 5 8 5-4M10 9v5"/>
    </g>
    <rect x="48" y="25" width="68" height="5" rx="2.5" fill="#484f5c" opacity="0.76"/>
    <rect x="48" y="35" width="43" height="4" rx="2" fill="#9aa3b2" opacity="0.6"/>
    <circle cx="222" cy="31" r="3" fill="#e3e5e9"/>
    <rect x="17" y="60" width="216" height="210" rx="11" fill="#f0f2f6"/>
    <rect x="17" y="60" width="216" height="210" rx="11" fill="url(#dot-grid)" opacity="0.75"/>
    <path d="m51 235 74-31 74 31-74 24-74-24Z" fill="#ffffff" stroke="#dedfe3"/>
    <path d="m51 235 74 24 74-24v9l-74 24-74-24v-9Z" fill="#e3e5e9" opacity="0.75"/>
    <use xlink:href="#vase" transform="translate(45 73)"/>
    <g stroke="#0052d9" stroke-width="1" opacity="0.65">
      <path d="M69 108v-8h8m96 8v-8h-8M69 224v8h8m96-8v8h-8"/>
      <path d="M194 112v112m-4-112h8m-8 112h8" stroke-dasharray="2 3"/>
    </g>
    <g transform="translate(17 286)">
      <rect width="64" height="55" rx="7" fill="#e8effc" stroke="#0052d9" stroke-width="1.5"/>
      <use xlink:href="#vase" transform="translate(12 3) scale(.25)"/>
      <circle cx="53" cy="11" r="6" fill="#0052d9"/>
      <use xlink:href="#check" transform="translate(53 11) scale(.65)" color="#ffffff"/>
      <rect x="76" width="64" height="55" rx="7" fill="#f0f2f6" stroke="#dedfe3"/>
      <g transform="translate(94 12)">
        <path d="m2 6 13-5 13 5v23l-13 6-13-6V6Z" fill="#9aa3b2" opacity="0.5"/>
        <path d="m2 6 13 6 13-6M15 12v23" stroke="#ffffff" stroke-opacity="0.65"/>
      </g>
      <rect x="152" width="64" height="55" rx="7" fill="#f0f2f6" stroke="#dedfe3"/>
      <g transform="translate(167 12)" fill="#9aa3b2" opacity="0.45">
        <path d="m17 0 14 9-4 23H7L3 9 17 0Z"/><ellipse cx="17" cy="9" rx="14" ry="5"/>
      </g>
    </g>
  </g>

  <!-- Configuration: material/color choices and dimensional adjustments. -->
  <g transform="translate(356 70)">
    <rect width="220" height="214" rx="15" fill="#ffffff" stroke="#dedfe3" filter="url(#card-shadow)"/>
    <g transform="translate(20 21)" stroke="#0052d9" stroke-width="1.6" stroke-linecap="round">
      <path d="M0 3h16M0 11h16"/><circle cx="5" cy="3" r="2.5" fill="#ffffff"/><circle cx="11" cy="11" r="2.5" fill="#ffffff"/>
    </g>
    <rect x="46" y="22" width="71" height="5" rx="2.5" fill="#484f5c" opacity="0.76"/>
    <rect x="46" y="32" width="44" height="4" rx="2" fill="#9aa3b2" opacity="0.6"/>
    <path d="M20 56h180" stroke="#dedfe3"/>
    <g transform="translate(36 82)">
      <circle r="12" fill="#0052d9"/><circle r="16" stroke="#0052d9"/>
      <use xlink:href="#check" color="#ffffff"/>
      <circle cx="45" r="12" fill="#484f5c"/><circle cx="90" r="12" fill="#b4bdce"/><circle cx="135" r="12" fill="#e5e7eb" stroke="#dedfe3"/>
    </g>
    <g stroke-linecap="round">
      <path d="M24 123h172M24 160h172" stroke="#e3e5e9" stroke-width="3"/>
      <path d="M24 123h99M24 160h58" stroke="#0052d9" stroke-width="3"/>
      <circle cx="123" cy="123" r="6" fill="#ffffff" stroke="#0052d9" stroke-width="2"/>
      <circle cx="82" cy="160" r="6" fill="#ffffff" stroke="#0052d9" stroke-width="2"/>
      <path d="M24 134v3m43-3v3m43-3v3m43-3v3m43-3v3M24 171v3m43-3v3m43-3v3m43-3v3m43-3v3" stroke="#9aa3b2" stroke-opacity="0.6"/>
    </g>
    <rect x="24" y="188" width="46" height="4" rx="2" fill="#9aa3b2" opacity="0.5"/>
    <rect x="164" y="185" width="32" height="10" rx="5" fill="#e8effc"/>
    <circle cx="189" cy="190" r="3" fill="#0052d9"/>
  </g>

  <!-- Order: the chosen object and options become a single confirmed record. -->
  <g transform="translate(356 320)">
    <rect width="220" height="214" rx="15" fill="#ffffff" stroke="#dedfe3" filter="url(#card-shadow)"/>
    <g transform="translate(21 20)" stroke="#484f5c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M1 0h11l3 3v13H1V0Z"/><path d="M11 0v4h4M5 8h6M5 12h4"/>
    </g>
    <rect x="47" y="23" width="63" height="5" rx="2.5" fill="#484f5c" opacity="0.76"/>
    <rect x="47" y="33" width="38" height="4" rx="2" fill="#9aa3b2" opacity="0.6"/>
    <rect x="20" y="58" width="55" height="63" rx="7" fill="#f0f2f6"/>
    <use xlink:href="#vase" transform="translate(23 62) scale(.31)"/>
    <rect x="88" y="65" width="87" height="5" rx="2.5" fill="#484f5c" opacity="0.65"/>
    <rect x="88" y="78" width="65" height="4" rx="2" fill="#9aa3b2" opacity="0.6"/>
    <rect x="88" y="95" width="30" height="15" rx="4" fill="#e8effc"/>
    <circle cx="96" cy="102.5" r="3" fill="#0052d9"/>
    <path d="M104 102.5h7" stroke="#0052d9" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <rect x="124" y="95" width="37" height="15" rx="4" fill="#f0f2f6"/>
    <path d="M133 102.5h19" stroke="#9aa3b2" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M20 136h180" stroke="#dedfe3" stroke-dasharray="3 4"/>
    <rect x="21" y="149" width="49" height="4" rx="2" fill="#9aa3b2" opacity="0.65"/>
    <rect x="160" y="149" width="39" height="4" rx="2" fill="#484f5c" opacity="0.65"/>
    <rect x="20" y="172" width="180" height="24" rx="6" fill="#e8effc"/>
    <circle cx="96" cy="184" r="6" fill="#0052d9"/>
    <use xlink:href="#check" transform="translate(96 184) scale(.72)" color="#ffffff"/>
    <path d="M109 184h18" stroke="#0052d9" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Fulfilment: package status and a completed delivery path. -->
  <g transform="translate(626 173)">
    <rect width="218" height="276" rx="16" fill="#ffffff" stroke="#dedfe3" filter="url(#card-shadow)"/>
    <g transform="translate(20 20)" stroke="#0052d9" stroke-width="1.5" stroke-linejoin="round">
      <path d="m8 0 8 4v9l-8 4-8-4V4l8-4Z"/><path d="m0 4 8 4 8-4M8 8v9M4 2l8 4"/>
    </g>
    <rect x="47" y="23" width="73" height="5" rx="2.5" fill="#484f5c" opacity="0.76"/>
    <rect x="47" y="33" width="48" height="4" rx="2" fill="#9aa3b2" opacity="0.6"/>
    <rect x="19" y="57" width="180" height="131" rx="9" fill="#f0f2f6"/>
    <path d="M40 160h138M49 171h120" stroke="#d9e2f1" stroke-linecap="round"/>
    <ellipse cx="110" cy="165" rx="48" ry="7" fill="#243c65" opacity="0.1" filter="url(#object-shadow)"/>
    <path d="m65 101 44-24 45 24-45 25-44-25Z" fill="#95baff"/>
    <path d="m65 101 44 25v45l-44-25v-45Z" fill="#4388f4"/>
    <path d="m109 126 45-25v45l-45 25v-45Z" fill="#0052d9"/>
    <path d="m86 89 45 25v19l-12 7v-19L75 95l11-6Z" fill="#ffffff" opacity="0.62"/>
    <path d="m77 130 15 8v11l-15-8v-11Z" fill="#ffffff" opacity="0.6"/>
    <path d="m79 134 8 4m-8 0 5 3" stroke="#3479d2" stroke-width="1.2"/>
    <circle cx="161" cy="152" r="15" fill="#ffffff" stroke="#0052d9" stroke-width="1.2"/>
    <use xlink:href="#check" transform="translate(161 152) scale(1.45)" color="#0052d9"/>
    <path d="M37 215h144" stroke="#bdcce7" stroke-width="2"/>
    <path d="M37 215h94" stroke="#0052d9" stroke-width="2"/>
    <g fill="#0052d9" stroke="#ffffff" stroke-width="3">
      <circle cx="37" cy="215" r="7"/><circle cx="84" cy="215" r="7"/><circle cx="131" cy="215" r="7"/>
    </g>
    <circle cx="179" cy="215" r="6" fill="#ffffff" stroke="#0052d9" stroke-width="1.5"/>
    <use xlink:href="#check" transform="translate(37 215) scale(.6)" color="#ffffff"/>
    <use xlink:href="#check" transform="translate(84 215) scale(.6)" color="#ffffff"/>
    <circle cx="131" cy="215" r="2" fill="#ffffff"/>
    <g stroke="#9aa3b2" stroke-width="3" stroke-linecap="round" opacity="0.5">
      <path d="M28 235h18M75 235h18M122 235h18M170 235h18"/>
    </g>
    <rect x="76" y="253" width="65" height="3" rx="1.5" fill="#e3e5e9"/>
  </g>
</svg>
