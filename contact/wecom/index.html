<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0d1118" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="兰芯云朵销售经理企业微信联系方式。" />
  <link rel="canonical" href="https://lancloudtech.com/contact/wecom/" />
  <title>联系兰芯云朵销售经理 · LAN Cloud AI</title>
  <link rel="icon" href="../../images/logo/WEB-logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="../../images/logo/WEB-logo-180.png" />
  <script>document.documentElement.classList.toggle("is-wechat-browser", /(?:MicroMessenger|wxwork)/i.test(navigator.userAgent));</script>
  <link rel="stylesheet" href="./wecom-card.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>

  <main id="main-content" tabindex="-1">
    <article class="business-card" aria-labelledby="card-title">
      <a class="brand-link" href="../../" aria-label="返回兰芯云朵官网首页">
        <img src="../../images/logo/WEB-logo.svg" width="32" height="31" alt="" />
        <span>LAN Cloud AI</span>
      </a>

      <header class="card-heading">
        <p class="card-kicker">企业微信</p>
        <h1 id="card-title"><span class="copy-line">联系兰芯云朵</span><span class="copy-line">销售经理</span></h1>
      </header>

      <div class="qr-panel">
        <div class="qr-tile">
          <img
            src="../../images/contact/wecom-sales-manager-qr.png"
            width="900"
            height="900"
            alt="兰芯云朵销售经理企业微信二维码"
            draggable="false"
          />
        </div>
        <p class="wechat-copy wechat-copy-default"><span class="copy-unit">我是兰芯云朵销售经理，</span><span class="copy-unit">这是我的企业微信，</span><span class="copy-unit">请您使用微信扫描二维码</span><span class="copy-unit">与我取得联系</span></p>
        <p class="wechat-copy wechat-copy-in-app"><span class="copy-unit">我是兰芯云朵销售经理，</span><span class="copy-unit">请您长按二维码，</span><span class="copy-unit">添加我的企业微信</span></p>
      </div>

      <div class="card-actions">
        <a class="button button-primary" href="../../#contact" data-card-return>返回兰芯云朵官网</a>
      </div>
    </article>
  </main>

  <script type="module" src="./wecom-card.js"></script>
</body>
</html>
