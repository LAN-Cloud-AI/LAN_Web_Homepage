# LAN Cloud AI official site — versioned in repo.
# Install: node scripts/apply-nginx.mjs
# Do not let Certbot rewrite the 443 server_name back to www+apex on one vhost.

limit_req_zone $binary_remote_addr zone=lan_req:10m rate=20r/s;

map $uri $lan_error_404 {
    default /404.html;
    ~^/en/ /en/404.html;
    ~^/zh-Hant/ /zh-Hant/404.html;
}

# Only canonicalize when the client asked for /index.html, not after
# an internal directory → index.html lookup (that looped /en/ → 301 /en/).
map $request_uri $lan_index_canonical {
    default "";
    ~^/index\.html(?:\?.*)?$ /;
    ~^/en/index\.html(?:\?.*)?$ /en/;
    ~^/zh-Hant/index\.html(?:\?.*)?$ /zh-Hant/;
}

# www → apex, keep path and query
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.lancloudtech.com;

    ssl_certificate /etc/letsencrypt/live/lancloudtech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lancloudtech.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://lancloudtech.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lancloudtech.com;

    root /var/www/lancloudtech.com;
    index index.html;
    error_page 404 $lan_error_404;

    access_log /var/log/nginx/lancloudtech.access.log;
    error_log  /var/log/nginx/lancloudtech.error.log;

    ssl_certificate /etc/letsencrypt/live/lancloudtech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lancloudtech.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/lancloudtech.com;
    }

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    if ($lan_index_canonical) {
        return 301 $lan_index_canonical;
    }

    location ^~ /leadshunter {
        return 301 https://leadshunter.lancloudtech.com/;
    }

    location ^~ /images/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location ~* \.(?:html|js|css|txt|xml|webmanifest)$ {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location / {
        limit_req zone=lan_req burst=40 nodelay;
        try_files $uri $uri/ $uri.html =404;
    }

    location = /404.html { }
    location = /en/404.html { }
    location = /zh-Hant/404.html { }

    location ~ /\. {
        deny all;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 http://lancloudtech.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name lancloudtech.com www.lancloudtech.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/lancloudtech.com;
    }

    location / {
        return 301 https://lancloudtech.com$request_uri;
    }
}
