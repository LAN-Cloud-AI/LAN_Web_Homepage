# Umami collector + console. Install with apply-nginx.mjs.
# Collect paths stay public; the dashboard uses Umami's own login.

limit_req_zone $binary_remote_addr zone=umami_req:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name stats.lancloudtech.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/acme;
    }

    location / {
        return 301 https://stats.lancloudtech.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name stats.lancloudtech.com;

    ssl_certificate /etc/letsencrypt/live/stats.lancloudtech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stats.lancloudtech.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/stats.access.log;
    error_log  /var/log/nginx/stats.error.log;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location = /robots.txt {
        default_type text/plain;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        limit_req zone=umami_req burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
