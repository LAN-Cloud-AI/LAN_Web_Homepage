# Temporary HTTP-only vhost used to issue the Let's Encrypt cert.
server {
    listen 80;
    listen [::]:80;
    server_name stats.lancloudtech.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/acme;
    }

    location / {
        return 200 "stats cert pending\n";
        add_header Content-Type text/plain;
    }
}
